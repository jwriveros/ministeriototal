<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6A4FA3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Ministerio Total</title>

  <!-- Script de ArcGIS embeddable map -->
  <script type="module" src="https://js.arcgis.com/embeddable-components/4.33/arcgis-embeddable-components.esm.js"></script>

  <style>
    html {
      padding-bottom: env(safe-area-inset-bottom);
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #fff;
    }

    header {
      text-align: center;
      padding: 1.5em 1em 0 1em;
      font-size: 1.8em;
      font-weight: 600;
      color: #2b2b2b;
    }

    main {
      padding: 2em;
      padding-bottom: 80px;
      text-align: center;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #f5f5f5;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ccc;
      padding-bottom: env(safe-area-inset-bottom);
      height: 60px;
      align-items: center;
    }

    nav button {
      flex: 1;
      background: none;
      border: none;
      font-size: 1em;
      color: #444;
      height: 100%;
    }

    nav button.active {
      color: #6A4FA3;
      font-weight: bold;
    }

    arcgis-embedded-map {
      width: 100%;
      height: 80vh;
      display: block;
    }
  </style>
</head>
<body>
  <header id="title">Inicio</header>

  <main id="content">
    <h1 style="font-size: 1.5em; font-weight: 600;">Bienvenido a la app para nuestro ministerio</h1>
  </main>

  <nav>
    <button id="btn-home" class="active">Inicio</button>
    <button id="btn-map">Territorios</button>
  </nav>

  <script>
    const content = document.getElementById("content");
    const title = document.getElementById("title");

    document.getElementById("btn-home").addEventListener("click", () => {
      title.innerText = "Inicio";
      content.innerHTML = `<h1 style="font-size: 1.5em; font-weight: 600;">Bienvenido a la app para nuestro ministerio</h1>`;
      toggleActive("btn-home");
    });

    document.getElementById("btn-map").addEventListener("click", () => {
      title.innerText = "Territorios";
      content.innerHTML = `
        <arcgis-embedded-map
          item-id="26140e40a84f48afa9c16cba4d15330f"
          theme="light"
          center="-73.06841575418468,6.605211537237317"
          scale="9027.977411"
          portal-url="https://www.arcgis.com">
        </arcgis-embedded-map>`;
      toggleActive("btn-map");
    });

    function toggleActive(activeId) {
      document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("active"));
      document.getElementById(activeId).classList.add("active");
    }

    // Optional: solicitar ubicación solo una vez al cargar
    window.addEventListener("load", () => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          () => console.log("Ubicación concedida"),
          () => console.warn("Permiso de ubicación denegado")
        );
      }
    });
  </script>
</body>
</html>
