
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#6A4FA3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Ministerio Total</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #fff;
    }

    header {
      text-align: center;
      padding: 1.5em 1em 0 1em;
      font-size: 1.8em;
      font-weight: 600;
      color: #2b2b2b;
    }

    main {
      padding: 2em;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #f5f5f5;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ccc;
    }

    nav button {
      flex: 1;
      padding: 1em 0;
      background: none;
      border: none;
      font-size: 1em;
      color: #444;
    }

    nav button.active {
      color: #6A4FA3;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header id="title">Inicio</header>
  <main id="content">
    <h1 style="font-size: 1.5em; font-weight: 600;">Bienvenido</h1>
  </main>

  <nav>
    <button id="btn-home" class="active">Inicio</button>
    <button id="btn-map">Territorio</button>
  </nav>

  <script>
    const content = document.getElementById("content");
    const title = document.getElementById("title");

    document.getElementById("btn-home").addEventListener("click", () => {
      title.innerText = "Inicio";
      content.innerHTML = `<h1 style="font-size: 1.5em; font-weight: 600;">Bienvenido</h1>`;
      toggleActive("btn-home");
    });

    document.getElementById("btn-map").addEventListener("click", () => {
      title.innerText = "Territorio";
      content.innerHTML = `<iframe src="https://arcg.is/1eLqOi0" allowfullscreen></iframe>`;
      toggleActive("btn-map");
    });

    function toggleActive(activeId) {
      document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("active"));
      document.getElementById(activeId).classList.add("active");
    }
  </script>
</body>
</html>
