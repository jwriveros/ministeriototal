<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6A4FA3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Ministerio Total</title>
  <style>
    html {
      padding-bottom: env(safe-area-inset-bottom);
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #fff;
    }

    header {
      text-align: center;
      padding: 1.5em 1em 0 1em;
      font-size: 1.8em;
      font-weight: 600;
      color: #2b2b2b;
    }

    main {
      padding: 2em;
      padding-bottom: 80px;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #f5f5f5;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ccc;
      padding-bottom: env(safe-area-inset-bottom);
      height: 60px;
      align-items: center;
    }

    nav button {
      flex: 1;
      background: none;
      border: none;
      font-size: 1em;
      color: #444;
      height: 100%;
    }

    nav button.active {
      color: #6A4FA3;
      font-weight: bold;
    }

    #splash-screen {
      position: fixed;
      z-index: 9999;
      background: #6A4FA3;
      color: white;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #splash-screen img {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash-screen">
    <img src="icon-192.png" alt="Logo" />
    <h2 style="font-size: 1.4em; font-weight: 600;">Ministerio Total</h2>
  </div>

  <header id="title">Inicio</header>

  <main id="content">
    <h1 style="font-size: 1.5em; font-weight: 600;">Bienvenido a la app para nuestro ministerio</h1>
  </main>

  <nav>
    <button id="btn-home" class="active">Inicio</button>
    <button id="btn-map">Territorios</button>
  </nav>

  <script>
    const content = document.getElementById("content");
    const title = document.getElementById("title");

    document.getElementById("btn-home").addEventListener("click", () => {
      title.innerText = "Inicio";
      content.innerHTML = `<h1 style="font-size: 1.5em; font-weight: 600;">Bienvenido a la app para nuestro ministerio</h1>`;
      toggleActive("btn-home");
    });

    document.getElementById("btn-map").addEventListener("click", () => {
      title.innerText = "Territorios";
      content.innerHTML = `
        <iframe src="https://www.arcgis.com/apps/instant/notification/index.html?appid=1f3c8e44bd1e41318519b94cba814bb7"
                allowfullscreen
                frameborder="0">
        No se admiten iFrames en esta página.
        </iframe>`;
      toggleActive("btn-map");
    });

    function toggleActive(activeId) {
      document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("active"));
      document.getElementById(activeId).classList.add("active");
    }

    // Ocultar splash screen cuando cargue la app
    window.addEventListener("load", () => {
      const splash = document.getElementById("splash-screen");
      if (splash) splash.style.display = "none";
    });
  </script>
</body>
</html>
